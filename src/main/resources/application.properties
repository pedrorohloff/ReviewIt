spring.application.name=ReviewIt
spring.config.import=optional:file:.env.properties

# PaaS platforms (Render/Railway/Fly) inject PORT; local runs default to 8080.
server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

supabase.jwt.jwks-url=${SUPABASE_JWT_JWKS_URL}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER}

# Comma-separated origins allowed to call the API from the browser.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.web.error.include-stacktrace=never
spring.mvc.throw-exception-if-no-handler-found=true
