<article class="card">
  <a
    class="card__link"
    [routerLink]="['/posts', post().id]"
    [state]="{ fromFeed: true }"
    [attr.aria-label]="linkLabel()"
  ></a>

  <app-review-cover class="card__cover" [type]="post().contentType" [title]="post().title" />

  <div class="card__body">
    <div class="card__meta">
      <span class="meta-chip meta-chip--type">{{ typeLabel() }}</span>
      <span class="meta-chip">{{ genreLabel() }}</span>
      <time class="card__time" [attr.datetime]="post().createdAt">
        {{ post().createdAt | relativeTime }}
      </time>
    </div>

    <h2>{{ post().title }}</h2>

    <div class="card__author">
      <app-avatar [name]="post().author.username" [url]="post().author.avatarUrl" [size]="28" />
      <span>{{ post().author.username }}</span>
    </div>

    <p class="card__excerpt">{{ post().content }}</p>

    <footer class="card__foot">
      <button
        type="button"
        class="stat stat--like"
        [class.stat--liked]="post().likedByMe"
        [attr.aria-pressed]="post().likedByMe ? 'true' : 'false'"
        [attr.aria-label]="likeLabel()"
        (click)="toggleLike($event)"
      >
        <app-icon
          name="heart"
          [size]="16"
          [strokeWidth]="post().likedByMe ? 2.25 : 1.75"
          [filled]="!!post().likedByMe"
        />
        <span>{{ post().likeCount }}</span>
      </button>

      <a
        class="stat stat--link"
        [routerLink]="['/posts', post().id]"
        fragment="comments"
        [state]="{ fromFeed: true }"
        [attr.aria-label]="commentLabel()"
      >
        <app-icon name="message" [size]="16" />
        <span>{{ post().commentCount }}</span>
      </a>

      <span class="read-more">
        ler mais
        <app-icon name="arrow-right" [size]="15" />
      </span>
    </footer>
  </div>
</article>
