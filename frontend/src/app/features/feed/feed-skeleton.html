<div class="skeleton" role="status">
  @if (!compact()) {
    <span class="skeleton__label">Carregando reviews…</span>
  }

  @for (item of items(); track item) {
    <div class="skeleton__card" aria-hidden="true">
      <div class="skeleton__cover"></div>
      <div class="skeleton__body">
        <div class="skeleton__chips">
          <span class="skeleton__chip"></span>
          <span class="skeleton__chip skeleton__chip--short"></span>
        </div>
        <div class="skeleton__line skeleton__line--title"></div>
        <div class="skeleton__line skeleton__line--author"></div>
        <div class="skeleton__line"></div>
        <div class="skeleton__line"></div>
        <div class="skeleton__line skeleton__line--medium"></div>
        <div class="skeleton__line skeleton__line--foot"></div>
      </div>
    </div>
  }
</div>
